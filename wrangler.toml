# Cloudflare Worker: static site + /api/meal-logs (R2).
# Soft-404 fix: do NOT use single-page-application — that serves index.html with 200.
name = "fibermaxxing"
main = "worker/index.ts"
compatibility_date = "2025-10-24"

[assets]
directory = "./dist"
binding = "ASSETS"
# Serve nearest 404.html with HTTP 404 when no asset matches.
not_found_handling = "404-page"
# Flat dist/<slug>.html → /<slug> without forcing a trailing-slash redirect.
html_handling = "drop-trailing-slash"
# Worker must see /slug/ before Assets soft-307 so our 301 runs first.
run_worker_first = true

# R2 bucket created in Dashboard: fibermaxxing-meal-logs
[[r2_buckets]]
binding = "MEAL_LOGS"
bucket_name = "fibermaxxing-meal-logs"

[vars]
# Kill switch for POST /api/meal-logs: set to "off" then redeploy to stop ingest.
MEAL_LOG_INGEST = "on"
# Free 7-day plan emails (Resend). Secret RESEND_API_KEY is set in the Cloudflare dashboard.
# Kill switch: set SUBSCRIBE = "off" and redeploy.
SUBSCRIBE = "on"
EMAIL_FROM = "GetFibermaxxing <plan@getfibermaxxing.com>"
# Paid 30-day plan. Set STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET and STRIPE_PRICE_ID in the
# dashboard as type Secret (plain dashboard variables are overwritten by Git deploys).
# Checkout refuses to open if the Stripe price's amount != PLAN_PRICE_CENTS.
# Kill switch: PLAN_SALES = "off" stops new checkouts (buyers keep access).
PLAN_SALES = "on"
PLAN_PRICE_CENTS = "900"
PLAN_REPLY_TO = "hello@getfibermaxxing.com"

# Hourly: plan emails go out at the first run from 15:00 UTC (7 a.m. Pacific) once due,
# so a missed or failed run catches up an hour later. Site traffic is a backup trigger.
[triggers]
crons = ["0 * * * *"]

# Keep Worker logs (plan email send errors, drip summaries) in the dashboard.
[observability]
enabled = true

# PR preview builds (`wrangler preview`). Every kill switch is off so a preview never
# writes meal logs, sends email or opens checkout. MEAL_LOGS points at the production
# bucket only because the binding is required; with ingest off nothing is written.
[previews.vars]
MEAL_LOG_INGEST = "off"
SUBSCRIBE = "off"
EMAIL_FROM = "GetFibermaxxing <plan@getfibermaxxing.com>"
PLAN_SALES = "off"
PLAN_PRICE_CENTS = "900"
PLAN_REPLY_TO = "hello@getfibermaxxing.com"

[[previews.r2_buckets]]
binding = "MEAL_LOGS"
bucket_name = "fibermaxxing-meal-logs"
