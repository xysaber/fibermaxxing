# Cloudflare Worker: static site + /api/meal-logs (R2).
# Soft-404 fix: do NOT use single-page-application — that serves index.html with 200.
name = "fibermaxxing"
main = "worker/index.ts"
compatibility_date = "2025-10-24"

[assets]
directory = "./dist"
binding = "ASSETS"
# Serve nearest 404.html with HTTP 404 when no asset matches.
not_found_handling = "404-page"
# Flat dist/<slug>.html → /<slug> without forcing a trailing-slash redirect.
html_handling = "drop-trailing-slash"
# Worker must see /slug/ before Assets soft-307 so our 301 runs first.
run_worker_first = true

# R2 bucket created in Dashboard: fibermaxxing-meal-logs
[[r2_buckets]]
binding = "MEAL_LOGS"
bucket_name = "fibermaxxing-meal-logs"

[vars]
# Kill switch for POST /api/meal-logs: set to "off" then redeploy to stop ingest.
MEAL_LOG_INGEST = "on"
