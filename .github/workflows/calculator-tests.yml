name: Calculator tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc -b
      - name: Fiber accuracy (100+ reference cases)
        run: npm run test:accuracy
      - name: Parser regression
        run: npm run test:parser
      - name: 30-day plan (content up to date, purchase flow)
        run: npm run test:plan
